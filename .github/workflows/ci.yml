# CI — Tests automatiques sur push et pull request vers main
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint
      - name: Token audit (couleurs hardcodées)
        run: node scripts/token-audit.mjs

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@brique-rouge/tokens
      - name: Vérifie que specs/foundations/ et specs/tokens/ sont à jour
        run: |
          if ! git diff --exit-code -- specs/foundations specs/tokens; then
            echo "::error::specs/foundations/ ou specs/tokens/ désynchronisé avec tokens.json — relancer 'pnpm --filter @brique-rouge/tokens build' et committer le résultat."
            exit 1
          fi
      - name: Tests
        run: |
          TEST_FILES=$(find packages -name "*.test.tsx" -o -name "*.test.ts" 2>/dev/null)
          if [ -z "$TEST_FILES" ]; then
            echo "Aucun fichier de test trouvé — étape ignorée."
            exit 0
          fi
          pnpm test
