# CI — Tests automatiques sur push et pull request vers main
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint
      - name: Token audit (couleurs hardcodées)
        run: node scripts/token-audit.mjs
      - name: Contraste des paires de tokens (WCAG 1.4.3 / 1.4.11)
        run: node scripts/contrast-audit.mjs
      - name: Cohérence composants ↔ fiches specs
        run: node scripts/check-specs.mjs
      - name: Tests des scripts (synchro Figma, fiches specs)
        run: node --test scripts/figma-sync-tokens.test.mjs scripts/figma-sync-ds.test.mjs scripts/check-specs.test.mjs scripts/contrast-audit.test.mjs

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@brique-rouge/tokens
      - name: Vérifie que specs/foundations/ et specs/tokens/ sont à jour
        run: |
          if ! git diff --exit-code -- specs/foundations specs/tokens; then
            echo "::error::specs/foundations/ ou specs/tokens/ désynchronisé avec tokens.json — relancer 'pnpm --filter @brique-rouge/tokens build' et committer le résultat."
            exit 1
          fi
      - name: Tests
        run: |
          TEST_FILES=$(find packages -name "*.test.tsx" -o -name "*.test.ts" 2>/dev/null)
          if [ -z "$TEST_FILES" ]; then
            echo "Aucun fichier de test trouvé — étape ignorée."
            exit 0
          fi
          pnpm test
